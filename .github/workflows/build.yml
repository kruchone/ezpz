name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ezpz.exe
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: ezpz
          path: ezpz.exe

      # Pushing a tag like v1.0.0 publishes a GitHub release with ezpz.exe attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ezpz.exe
          generate_release_notes: true
